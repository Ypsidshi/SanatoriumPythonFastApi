name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # pyodbc ships manylinux wheels, but the headers keep the install working
      # if a source build is ever needed.
      - name: Install ODBC headers
        run: sudo apt-get update && sudo apt-get install -y unixodbc-dev

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Test
        # The suite runs against in-memory SQLite; the live smoke tests skip
        # themselves unless BASE_URL points at a deployed API.
        run: pytest
