[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = [".venv", "sql"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # import sorting
    "UP",   # pyupgrade
    "B",    # bugbear
    "C4",   # comprehensions
    "SIM",  # simplifications
    "RUF",  # ruff-specific
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI declares dependencies and query parameters as call expressions in
# default arguments; that is the framework idiom, not a mutable-default bug.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body"]

[tool.ruff.lint.per-file-ignores]
# DATABASE_URL has to be set before the application package is imported.
"tests/conftest.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Put the project root on sys.path so `import app` works under a plain
# `pytest` invocation, not only under `python -m pytest`.
pythonpath = ["."]
